<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF Platform - Vérification 2FA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body class="auth-page">
    <button class="theme-toggle theme-toggle-floating" onclick="toggleTheme()" id="themeBtn" aria-label="Changer de thème">🌙</button>

    <div class="login-container">
        <div class="logo">🔐</div>
        <h1>Vérification en 2 étapes</h1>
        <p class="subtitle">Entre le code à 6 chiffres de ton application d'authentification</p>

        {% if error %}
        <p class="error-message">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('verify_2fa') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="input-group">
                <label for="code">Code</label>
                <input type="text" id="code" name="code" placeholder="123456" inputmode="numeric" maxlength="6" required autofocus>
            </div>
            <button type="submit">Vérifier</button>
        </form>
    </div>

    <script>
        function updateThemeBtn() {
            var btn = document.getElementById('themeBtn');
            if (btn) { btn.textContent = document.documentElement.getAttribute('data-theme') === 'light' ? '☀️' : '🌙'; }
        }
        function toggleTheme() {
            var current = document.documentElement.getAttribute('data-theme') || 'dark';
            var next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeBtn();
        }
        updateThemeBtn();
    </script>
</body>
</html>
