<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF Platform - Classement public</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <button class="theme-toggle theme-toggle-floating" onclick="toggleTheme()" id="themeBtn" aria-label="Changer de thème">🌙</button>


    <nav class="landing-nav">
        <a href="{{ url_for('index') }}" class="nav-logo">🛡️ CTF Platform</a>
        <div class="landing-nav-links">
            <a href="{{ url_for('login_page') }}">Se connecter</a>
            <a href="{{ url_for('register') }}" class="btn-small">S'inscrire</a>
        </div>
    </nav>

    <div class="challenges-page">
        <div class="challenges-header">
            <h1>Classement public</h1>
        </div>

        <div class="leaderboard-list">
            {% for rank in rankings %}
            <div class="leaderboard-row">
                <span class="rank-number">
                    {% if loop.index == 1 %}🥇
                    {% elif loop.index == 2 %}🥈
                    {% elif loop.index == 3 %}🥉
                    {% else %}#{{ loop.index }}
                    {% endif %}
                </span>
                <span class="rank-username">{{ rank.username }}</span>
                <span class="rank-points">{{ rank.total_points }} pts</span>
            </div>
            {% endfor %}
        </div>
    </div>


    <script>
        function updateThemeBtn() {
            var btn = document.getElementById('themeBtn');
            if (btn) {
                btn.textContent = document.documentElement.getAttribute('data-theme') === 'light' ? '☀️' : '🌙';
            }
        }
        function toggleTheme() {
            var current = document.documentElement.getAttribute('data-theme') || 'dark';
            var next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeBtn();
        }
        updateThemeBtn();
    </script>
</body>
</html>
