<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF Platform - Inscription</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body class="auth-page">
    <button class="theme-toggle theme-toggle-floating" onclick="toggleTheme()" id="themeBtn" aria-label="Changer de thème">🌙</button>


    <div class="login-container">
        <div class="logo">🛡️</div>
        <h1>Créer un compte</h1>
        <p class="subtitle">Rejoins la plateforme et commence les challenges</p>

        {% if error %}
        <p class="error-message">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('register') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="input-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" placeholder="User" required>
            </div>

            <div class="input-group">
                <label for="password">Mot de passe</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <span class="toggle-password" onclick="togglePassword()">👁</span>
                </div>
            </div>

            <div class="input-group">
                <label for="invite_code">Code d'invitation</label>
                <input type="text" id="invite_code" name="invite_code" placeholder="Donné par ton prof/organisateur" required>
            </div>

            <button type="submit">S'inscrire</button>
        </form>

        <p class="register-link">Déjà un compte ? <a href="{{ url_for('login_page') }}">Connecte-toi</a></p>
    </div>

    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            pwd.type = pwd.type === 'password' ? 'text' : 'password';
        }
    </script>


    <script>
        function updateThemeBtn() {
            var btn = document.getElementById('themeBtn');
            if (btn) {
                btn.textContent = document.documentElement.getAttribute('data-theme') === 'light' ? '☀️' : '🌙';
            }
        }
        function toggleTheme() {
            var current = document.documentElement.getAttribute('data-theme') || 'dark';
            var next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeBtn();
        }
        updateThemeBtn();
    </script>
</body>
</html>
